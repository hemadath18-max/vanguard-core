<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroMindAI - Secure System Shield</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --panel-card: #131a26;
            --primary-blue: #00d2ff;
            --secure-green: #2ecc71;
            --alert-red: #e74c3c;
            --text-white: #ffffff;
            --text-gray: #8a9ba8;
            --border-line: #1e293b;
        }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden; box-sizing: border-box;
        }

        /* Clean Main Phone Wrapper Layout */
        .app-container {
            width: 100vw; min-height: 100vh;
            max-width: 440px; padding: 25px 20px;
            box-sizing: border-box; display: flex;
            flex-direction: column; align-items: center;
        }

        /* Clean Minimal Branding Typography */
        .app-title {
            font-size: 26px; font-weight: 800; letter-spacing: 1px;
            color: var(--text-white); margin: 15px 0 4px 0; text-align: center;
        }

        .app-subtitle {
            font-size: 12px; font-weight: 500; color: var(--text-gray);
            letter-spacing: 1px; text-transform: uppercase; margin-bottom: 40px;
        }

        /* Huge Clear Status Hub Circle */
        .status-circle-hub {
            width: 170px; height: 170px; border-radius: 50%;
            border: 5px solid var(--secure-green); background: rgba(46, 204, 113, 0.05);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            margin-bottom: 45px; transition: all 0.3s ease;
        }

        .hub-emoji { font-size: 48px; margin-bottom: 6px; }
        .hub-label-string { font-size: 18px; font-weight: 700; color: var(--secure-green); letter-spacing: 2px; }

        /* Highly Understandable Tracking Blocks */
        .metrics-row-wrapper {
            display: flex; gap: 15px; width: 100%; margin-bottom: 35px;
        }

        .metric-block-card {
            flex: 1; background: var(--panel-card); border: 1px solid var(--border-line);
            border-radius: 12px; padding: 20px 10px; text-align: center;
        }

        .metric-display-number { font-size: 32px; font-weight: 800; color: var(--primary-blue); }
        .metric-display-title { font-size: 11px; font-weight: 600; color: var(--text-gray); margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Huge, Clear Action Control Panels */
        .control-panel-row {
            width: 100%; background: var(--panel-card); border: 1px solid var(--border-line);
            border-radius: 14px; padding: 16px 20px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box;
        }

        .control-row-text { font-size: 15px; font-weight: 600; color: #f1f5f9; }
        
        .clean-action-btn {
            background: var(--primary-blue); border: none; padding: 12px 20px;
            border-radius: 8px; color: #0b0f17; font-weight: 700;
            font-size: 13px; cursor: pointer; text-transform: uppercase;
            transition: background 0.2s;
        }

        .clean-action-btn:active {
            transform: scale(0.97); background: #00b8e6;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-title">AstroMindAI</div>
    <div class="app-subtitle">Scam Shield Protection</div>

    <!-- Clear visual center safety display -->
    <div class="status-circle-hub" id="status-display-hub">
        <div class="hub-emoji" id="hub-visual-emoji">🛡️</div>
        <div class="hub-label-string" id="hub-text-message">SECURE</div>
    </div>

    <!-- Big clear data logs -->
    <div class="metrics-row-wrapper">
        <div class="metric-block-card">
            <div class="metric-display-number" id="scam-logs-counter">1,482</div>
            <div class="metric-display-title">Scams Blocked</div>
        </div>
        <div class="metric-block-card">
            <div class="metric-display-number" style="color: var(--secure-green);" id="active-incident-counter">0</div>
            <div class="metric-display-title">Active Threats</div>
        </div>
    </div>

    <!-- Uncluttered interface buttons -->
    <div class="control-panel-row">
        <div class="control-row-text">SMS Phishing Filter</div>
        <button class="clean-action-btn" onclick="simulateLiveAttackIntercept()">Run Test</button>
    </div>

    <div class="control-panel-row">
        <div class="control-row-text">Spoof Call Sandbox</div>
        <button class="clean-action-btn" style="background: #202b3c; color: var(--text-gray); border: 1px solid var(--border-line); cursor: default;">Active</button>
    </div>
</div>

<script>
    function simulateLiveAttackIntercept() {
        const activeThreats = document.getElementById('active-incident-counter');
        const scamsBlocked = document.getElementById('scam-logs-counter');
        const statusHub = document.getElementById('status-display-hub');
        const hubText = document.getElementById('hub-text-message');
        const hubEmoji = document.getElementById('hub-visual-emoji');

        // Step 1: Instantly show clean, understandable threat warning state
        activeThreats.innerText = "1";
        activeThreats.style.color = "var(--alert-red)";
        
        statusHub.style.borderColor = "var(--alert-red)";
        statusHub.style.background = "rgba(231, 76, 60, 0.05)";
        hubText.innerText = "ATTACK BLOCKED";
        hubText.style.color = "var(--alert-red)";
        hubEmoji.innerText = "⚠️";

        // Step 2: Clear threat state after 2 seconds to prove system processing works
        setTimeout(() => {
            let currentBlockedValue = parseInt(scamsBlocked.innerText.replace(',', ''));
            scamsBlocked.innerText = (currentBlockedValue + 1).toLocaleString();
            
            activeThreats.innerText = "0";
            activeThreats.style.color = "var(--secure-green)";
            
            statusHub.style.borderColor = "var(--secure-green)";
            statusHub.style.background = "rgba(46, 204, 113, 0.05)";
            hubText.innerText = "SECURE";
            hubText.style.color = "var(--secure-green)";
            hubEmoji.innerText = "🛡️";
            
            alert("🚨 [AstroMindAI Action]: A fraudulent phishing domain was intercepted and blocked from your device interface. Your phone remains clean.");
        }, 2000);
    }
</script>

</body>
                </html>
