<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstroMindAI - Threat Shield Matrix</title>
    <style>
        :root {
            --bg-deep: #05070a;
            --panel-bg: #0c1017;
            --neon-cyan: #00f0ff;
            --neon-red: #ff0055;
            --neon-green: #39ff14;
            --text-bright: #ffffff;
            --border-glow: #1a2333;
        }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-bright);
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; overflow-x: hidden;
            box-sizing: border-box;
        }

        /* Giant Core Shield Container */
        .app-mainframe {
            width: 100vw; min-height: 100vh;
            background: linear-gradient(180deg, #05070a 0%, #0c1017 100%);
            padding: 30px 20px; box-sizing: border-box;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Huge Brand Typography */
        .brand-master-title {
            font-size: 32px; font-weight: 900; text-transform: uppercase;
            color: var(--neon-cyan); letter-spacing: 5px; text-align: center;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6); margin: 10px 0 5px 0;
        }

        .brand-sub-banner {
            font-size: 12px; color: #52667a; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 35px; text-align: center;
        }

        /* Giant Floating Pulse Core Shield */
        .status-shield-orb {
            width: 180px; height: 180px; border-radius: 50%;
            border: 4px solid var(--neon-green); background: rgba(57, 255, 20, 0.03);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 0 0 35px rgba(57, 255, 20, 0.3);
            animation: globalPulse 2.5s infinite ease-in-out; margin-bottom: 40px;
        }

        .orb-icon { font-size: 55px; margin-bottom: 8px; }
        .orb-text { font-size: 20px; font-weight: bold; color: var(--neon-green); letter-spacing: 3px; }

        /* Massive Live Metric Analytics Counter Blocks */
        .metrics-grid-system {
            display: flex; gap: 15px; width: 100%; max-width: 400px; margin-bottom: 35px;
        }

        .metric-data-card {
            flex: 1; background: var(--panel-bg); border: 1px solid var(--border-glow);
            border-radius: 12px; padding: 18px 10px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .metric-big-value { font-size: 28px; font-weight: bold; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
        .metric-card-label { font-size: 11px; color: #62778c; margin-top: 6px; letter-spacing: 1px; text-transform: uppercase; }

        /* Massive Interactive System Toggles */
        .control-toggle-wrapper {
            width: 100%; max-width: 400px;
            background: rgba(12, 16, 23, 0.7); border: 1px solid var(--border-glow);
            border-radius: 12px; padding: 18px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; border-left: 4px solid var(--neon-cyan);
        }

        .toggle-system-title { font-size: 15px; font-weight: bold; letter-spacing: 1px; color: #cbd5e1; }
        
        .huge-action-button {
            background: linear-gradient(135deg, #00f0ff 0%, #0077ff 100%);
            border: none; padding: 12px 24px; border-radius: 8px;
            color: #05070a; font-family: monospace; font-weight: 900;
            font-size: 13px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); text-transform: uppercase;
        }

        .huge-action-button:active {
            transform: scale(0.96); background: var(--neon-cyan);
        }

        @keyframes globalPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(57, 255, 20, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(57, 255, 20, 0.5); border-color: #00ffcc; }
        }
    </style>
</head>
<body>

<div class="app-mainframe">
    <div class="brand-master-title">AstroMindAI</div>
    <div class="brand-sub-banner">Threat Firewall Subsystem Matrix</div>

    <div class="status-shield-orb" id="main-orb">
        <div class="orb-icon" id="orb-emoji">🛡️</div>
        <div class="orb-text" id="orb-status-string">ACTIVE</div>
    </div>

    <div class="metrics-grid-system">
        <div class="metric-data-card">
            <div class="metric-big-value" id="hacker-attacks-counter">8,241</div>
            <div class="metric-card-label">Threats Defeated</div>
        </div>
        <div class="metric-data-card">
            <div class="metric-big-value" style="color: var(--neon-green);" id="active-danger-counter">0</div>
            <div class="metric-card-label">Active Attacks</div>
        </div>
    </div>

    <div class="control-toggle-wrapper">
        <div class="toggle-system-title">SMS Anti-Phishing Shield</div>
        <button class="huge-action-button" onclick="executeMockAttackSequence()">Test Intercept</button>
    </div>

    <div class="control-toggle-wrapper" style="border-left-color: #a855f7;">
        <div class="toggle-system-title">Spoof Caller Sandbox</div>
        <button class="huge-action-button" style="background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: #fff; box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);">Protected</button>
    </div>
</div>

<script>
    function executeMockAttackSequence() {
        const attackCounter = document.getElementById('active-danger-counter');
        const totalDefeated = document.getElementById('hacker-attacks-counter');
        const mainOrb = document.getElementById('main-orb');
        const orbStatus = document.getElementById('orb-status-string');
        const orbEmoji = document.getElementById('orb-emoji');

        // Trigger red alarm attack sequence state
        attackCounter.innerText = "1";
        attackCounter.style.color = "#ff0055";
        mainOrb.style.borderColor = "#ff0055";
        mainOrb.style.boxShadow = "0 0 50px rgba(255, 0, 85, 0.6)";
        orbStatus.innerText = "BREACH BLOCK";
        orbStatus.style.color = "#ff0055";
        orbEmoji.innerText = "⚠️";

        // Wait 2.5 seconds to neutralize threat and update logs
        setTimeout(() => {
            let currentDefeatedValue = parseInt(totalDefeated.innerText.replace(',', ''));
            totalDefeated.innerText = (currentDefeatedValue + 1).toLocaleString();
            
            attackCounter.innerText = "0";
            attackCounter.style.color = "#39ff14";
            mainOrb.style.borderColor = "#39ff14";
            mainOrb.style.boxShadow = "0 0 35px rgba(57, 255, 20, 0.3)";
            orbStatus.innerText = "SECURE";
            orbStatus.style.color = "#39ff14";
            orbEmoji.innerText = "🛡️";
            
            alert("🚨 [ASTROMIND AI SHIELD ACTION]: A high-risk spoof payload targeted your phone layout. Threat detected and erased from memory grid.");
        }, 2500);
    }
</script>

</body>
            </html>
